name: Feature request
description: Suggest a new feature or a change to CLArgs.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion. Please check the existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible with CLArgs today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should CLArgs behave? An example of the API or the command line helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including workarounds in your own code.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
